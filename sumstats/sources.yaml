# PGS Sumstats Sources
#
# Each entry documents where sumstats came from, how to download, and how to convert to COJO format.
# COJO format columns: SNP, A1, A2, freq, b, se, p, N
#
# source_type values:
#   - gwas_catalog: GWAS Catalog harmonized format (FTP downloadable)
#   - pgc: Psychiatric Genomics Consortium (often requires manual download)
#   - opengwas: OpenGWAS/IEU (API or direct URL)
#   - direct: Direct from study authors/supplementary
#
# Sample size fields:
#   - n_samples: Publication-level total N (may be multi-ancestry, all cohorts)
#   - file_n: Sample sizes from the actual sumstats file (may differ due to ancestry subset, 23andMe exclusion, etc.)
#       - source: where the values came from
#           - "sumstats_header": from ## header lines (PGC VCF format)
#           - "column_names": from column names like FRQ_A_N, FRQ_U_N (daner format)
#           - "data_columns": from per-SNP columns like Nca, Nco (daner format)
#           - "data_column_max": max value from N column (continuous traits)
#       - n_case, n_control, n_effective, n_cohort, n_max: as available
#
# QC filters to apply before SBayesRC (TODO - not yet implemented in wrangle.py):
#   1. Remove strand ambiguous SNPs (A/T and G/C allele pairs)
#   2. INFO > 0.6 (imputation quality, when available)
#   3. MAF > 1% (minor allele frequency)
#   4. Neff > 50% of max Neff (SNP-specific effective N), OR
#      >50% of cohorts contributed (from direction column, when available)
#   5. Exclude MHC region (chr6:25-35 Mb in GRCh37)
#
# Reference: Cross-disorder GWAS QC (e.g., PGC cross-disorder papers)
# Genome build: GRCh37/hg19 throughout

sources:

