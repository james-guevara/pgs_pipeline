    ancestry: EUR
    n_samples: 225534
    source_type: pgc
    download:
      method: manual
      url: "https://figshare.com/articles/dataset/adhd2022/22564390"
      notes: "PGC figshare - AWS WAF bot protection, must download via browser"
    raw_file: "ADHD2022_iPSYCH_deCODE_PGC.meta.gz"
    format: daner
    # Sample sizes from column names (FRQ_A_N, FRQ_U_N)
    file_n:
      source: column_names
      n_case: 38691
      n_control: 186843
    column_mapping:
      snp: SNP
      a1: A1
      a2: A2
      freq: FRQ_U_186843  # frequency in controls
      beta: OR
      se: SE
      p: P
      n: null
    beta_is_or: true
    output_file: "adhd_2022.ma"
    sbayesrc_status: done

